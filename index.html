<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة الشعيبي - تسجيل الدخول والتحويل</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .card { max-width: 400px; margin: 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #007bff; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 14px; }
        button { width: 95%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .result { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تسجيل الدخول للمحفظة 💳</h2>
        <input type="email" id="loginEmail" placeholder="أدخل البريد الإلكتروني">
        <button onclick="login()">دخول</button>
        <div id="loginMsg" class="result"></div>
    </div>

    <div class="card" id="transferSection" style="display:none;">
        <h2>تحويل أموال 💸</h2>
        <input type="email" id="receiverEmail" placeholder="البريد الإلكتروني للمستلم">
        <input type="number" id="amount" placeholder="المبلغ المراد تحويله">
        <button onclick="transfer()">إرسال الأموال</button>
        <div id="transferMsg" class="result"></div>
    </div>

    <script>
        let currentSender = '';

        function login() {
            const email = document.getElementById('loginEmail').value;
            if(!email) {
                document.getElementById('loginMsg').innerText = "الرجاء إدخال البريد الإلكتروني";
                return;
            }
            currentSender = email;
            document.getElementById('loginMsg').innerText = "تم تسجيل الدخول بنجاح كـ: " + email;
            document.getElementById('loginMsg').style.color = "green";
            document.getElementById('transferSection').style.display = "block";
        }

        function transfer() {
            const receiver = document.getElementById('receiverEmail').value;
            const amount = document.getElementById('amount').value;

            if(!receiver || !amount) {
                document.getElementById('transferMsg').innerText = "يرجى ملء جميع البيانات";
                document.getElementById('transferMsg').style.color = "red";
                return;
            }

            document.getElementById('transferMsg').innerText = `تم طلب تحويل ${amount} ريال إلى ${receiver}`;
            document.getElementById('transferMsg').style.color = "blue";
        }
    </script>

</body>
</html>
